    <h1>sign up</h1>
    <form method="post" action="{{signup_path}}"><input type="hidden" name="csrf" value="{{csrf}}">
        <p><input name="name" placeholder="name" autocomplete="username" required value="{{name}}"></p>
        <p><input type="email" name="email" placeholder="email" autocomplete="email" maxlength="254" required value="{{email}}"></p>
        <p><input name="password" type="password" placeholder="password ({{password_min}}+ characters)" autocomplete="new-password" minlength="{{password_min}}" required></p>
        <p><button>sign up</button>{{#error}} <span class="error">{{error}}</span>{{/error}}</p>
    </form>
    <p>already registered? <a href="{{login_path}}">log in</a></p>
