    <h1>sign up</h1>
    <form method="post" action="/signup">
        <p><input name="name" placeholder="name" autocomplete="username" required value="{{name}}"></p>
        <p><input name="password" type="password" placeholder="password (8+ characters)" autocomplete="new-password" minlength="8" required></p>
        <p><button>sign up</button>{{#error}} <span class="error">{{error}}</span>{{/error}}</p>
    </form>
    <p>already registered? <a href="/login">log in</a></p>
